[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# Edge function handles /forms/* - serves OG tags for social crawlers
# Regular browsers get the SPA
[[edge_functions]]
  function = "og-proxy"
  path = "/forms/*"

# All other requests go to SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

